spring:
  application:
    name: gitlab-release-track
  codec:
    max-in-memory-size: 5MB
  datasource:
    url: jdbc:h2:file:./data/releaseapp;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  main:
    web-application-type: none

gitlab:
  base-url: ${GITLAB_BASE_URL}
  token: ${GITLAB_TOKEN}
  last-step: ${GITLAB_PIPELINE_LAST_STEP}

jira:
  base-url: ${JIRA_BASE_URL}
  token: ${JIRA_TOKEN}
  board-name: ${JIRA_BOARD_NAME}
  issue-status: ${JIRA_ISSUE_STATUS}
